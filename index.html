<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111316">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Parents' NYC Guide</title>
<link rel="stylesheet" crossorigin href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: one phone-width column under a black station-sign header, a fixed three-tab bar at the bottom, one big action per screen. */
:root{
  --ground:#F1F3F6; --card:#FFFFFF; --ink:#12151A; --muted:#48515E; --line:#C5CCD6;
  --sign:#111316; --sign-ink:#FFFFFF; --sign-edge:#111316;
  --e:#0039A6; --f:#FF6319; --bullet-ink:#FFFFFF; --bullet-ring:transparent;
  --e-line:#0039A6; --f-line:#FF6319; --link:#0039A6; --tint:#E2E9F6;
  --here:#FCCC0A; --here-ink:#12151A;
  --go:#0B7A3B; --go-ink:#FFFFFF; --stop:#C4161C; --stop-ink:#FFFFFF;
  --warn:#FFF1BF; --warn-ink:#3F3200;
  --food:#0B7A3B; --mosque:#0B6E8A; --wc:#6B3FA0; --sight:#B4470E; --pin-ink:#FFFFFF;
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --body:'Atkinson Hyperlegible',Verdana,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1013; --card:#1A1D22; --ink:#F3F4F1; --muted:#B7BFCB; --line:#3B424D;
    --sign:#000000; --sign-edge:#3B424D; --bullet-ring:rgba(255,255,255,.5);
    --e-line:#6B96FF; --link:#A9C1FF; --tint:#1A2740;
    --go:#35B36B; --go-ink:#04140A; --stop:#FF6B6B; --stop-ink:#200000;
    --warn:#3A2F00; --warn-ink:#FFE78F;
    --food:#35B36B; --mosque:#4FC3E0; --wc:#C4A1F5; --sight:#FF9F66; --pin-ink:#0E1013;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1013; --card:#1A1D22; --ink:#F3F4F1; --muted:#B7BFCB; --line:#3B424D;
  --sign:#000000; --sign-edge:#3B424D; --bullet-ring:rgba(255,255,255,.5);
  --e-line:#6B96FF; --link:#A9C1FF; --tint:#1A2740;
  --go:#35B36B; --go-ink:#04140A; --stop:#FF6B6B; --stop-ink:#200000;
  --warn:#3A2F00; --warn-ink:#FFE78F;
  --food:#35B36B; --mosque:#4FC3E0; --wc:#C4A1F5; --sight:#FF9F66; --pin-ink:#0E1013;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--here);outline-offset:2px}
h1,h2,h3,p{margin:0}

.app{max-width:520px;margin-inline:auto}
.top{position:relative;background:var(--sign);color:var(--sign-ink);border-bottom:1px solid var(--sign-edge);padding:14px 16px 12px}
.top::before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:var(--sign-ink)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.brand{font:800 20px/1.1 var(--display);letter-spacing:.01em}
.seg{display:flex;border:2px solid var(--sign-ink);border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:var(--sign-ink);border:0;padding:8px 14px;font:600 16px var(--display);min-height:44px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sign-ink);color:var(--sign)}
.demo-note{font-size:14px;opacity:.85;margin-top:8px}

main{padding-inline:16px;padding-block:16px 120px;display:flex;flex-direction:column;gap:16px}
main.family{padding-block:16px 40px}

.eyebrow{font:600 14px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h2{font:800 28px/1.15 var(--display);text-wrap:balance}
h3{font:800 21px/1.2 var(--display);text-wrap:balance}
.lead{font-size:20px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.stack{display:flex;flex-direction:column;gap:12px}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;width:100%;min-height:64px;padding:12px 18px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:800 20px/1.2 var(--display);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--go);border-color:var(--go);color:var(--go-ink)}
.btn.alert{background:var(--stop);border-color:var(--stop);color:var(--stop-ink)}
.btn.small{min-height:48px;font-size:17px;width:auto}
.linkbtn{background:none;border:0;padding:10px 4px;color:var(--link);text-decoration:underline;font-size:17px;cursor:pointer;align-self:center;min-height:44px}

.days{display:flex;gap:8px;flex-wrap:wrap}
.days button{flex:0 0 auto;min-height:52px;padding:8px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);font:600 17px var(--display);cursor:pointer}
.days button[aria-pressed="true"]{background:var(--here);color:var(--here-ink);border-color:var(--here-ink)}

.b{display:inline-grid;place-items:center;flex:0 0 auto;width:1.6em;height:1.6em;border-radius:50%;font:800 1em/1 var(--display);color:var(--bullet-ink);box-shadow:0 0 0 2px var(--bullet-ring)}
.b.E,.b.A,.b.C{background:var(--e)} .b.F{background:var(--f)}

.sign{position:relative;background:var(--sign);color:var(--sign-ink);border:1px solid var(--sign-edge);border-radius:6px;padding:20px 16px 16px;font-family:var(--display);display:flex;flex-direction:column;gap:8px}
.sign::before{content:"";position:absolute;left:0;right:0;top:8px;height:2px;background:var(--sign-ink)}
.sign-top{font-weight:800;font-size:26px;line-height:1.1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sign-sub{font-weight:600;font-size:17px}
.sign-cap{font:400 15px var(--body);color:var(--muted)}

.route{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:r}
.route li{counter-increment:r;display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start}
.route li::before{content:counter(r);font:800 16px var(--display);width:32px;height:32px;border-radius:8px;background:var(--tint);display:grid;place-items:center}
.route .b{vertical-align:middle;margin-right:4px}
.bs{display:inline-flex;gap:8px;white-space:nowrap}

.jhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.count{font:800 17px var(--display);font-variant-numeric:tabular-nums}
.bar{display:flex;gap:4px}
.bar i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.bar i.on{background:var(--go)}

.tip{background:var(--tint);border-radius:10px;padding:12px 14px;font-size:17px}
.ask{border:2px dashed var(--ink);border-radius:10px;padding:12px 14px}
.ask q{display:block;font:800 22px/1.2 var(--display);margin-top:6px;quotes:none}

.status{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.big-n{font:800 72px/1 var(--display);font-variant-numeric:tabular-nums;min-width:1.2ch;text-align:center}
.status dl{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.status dt{font:600 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.status dd{margin:0;font:800 20px/1.2 var(--display)}
.banner{border-radius:10px;padding:14px;font:800 21px/1.25 var(--display)}
.banner.warn{background:var(--here);color:var(--here-ink)}
.banner.go{background:var(--go);color:var(--go-ink)}
.banner.bad{background:var(--stop);color:var(--stop-ink)}
.banner p{font:400 18px/1.4 var(--body);margin-top:8px}

.stops{list-style:none;margin:0;padding:0}
.stops li{position:relative;display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;min-height:46px;padding:4px 8px 4px 0;border-radius:8px}
.stops li::before{content:"";position:absolute;left:11px;top:0;bottom:0;width:6px;background:var(--lc)}
.stops li:first-child::before{top:50%} .stops li:last-child::before{bottom:50%}
.stops .dot{position:relative;z-index:1;width:20px;height:20px;margin-left:4px;border-radius:50%;background:var(--card);border:4px solid var(--lc)}
.stops li.done{color:var(--muted)} .stops li.done .dot{background:var(--lc)}
.stops li.here{background:var(--here);color:var(--here-ink);font-weight:700}
.stops li.here .dot{background:var(--here-ink);border-color:var(--here-ink)}
.stops .tag{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:6px;background:var(--go);color:var(--go-ink);font:800 13px var(--display);letter-spacing:.04em;text-transform:uppercase}
.stops .tag.you{background:var(--here-ink);color:var(--here)}

.demo{border:2px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.demo .eyebrow{font-size:13px}
.demo-row{display:flex;gap:8px;flex-wrap:wrap}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{flex:0 0 auto;min-height:46px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-size:16px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}

.radar{width:100%;max-width:360px;align-self:center;display:block}
.radar .ring{fill:none;stroke:var(--line);stroke-width:1.5}
.radar .rl{fill:var(--muted);font:600 11px var(--display)}
.radar .pin text{fill:var(--pin-ink);font:800 13px var(--display)}
.radar .pin circle{stroke:var(--card);stroke-width:2}
.radar .you{fill:var(--here);stroke:var(--here-ink);stroke-width:3}
.radar .youl{fill:var(--ink);font:800 12px var(--display)}
.t-food{--pc:var(--food)} .t-mosque{--pc:var(--mosque)} .t-wc{--pc:var(--wc)} .t-sight{--pc:var(--sight)}
.radar .pin circle{fill:var(--pc)}

.places{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.places li{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.places li:first-child{border-top:0}
.num{width:32px;height:32px;border-radius:50%;background:var(--pc);color:var(--pin-ink);display:grid;place-items:center;font:800 15px var(--display)}
.pl-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.pl-name{font:800 19px/1.2 var(--display)}
.pl-type{font:600 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--pc)}
.pl-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.walk{font:800 17px var(--display);font-variant-numeric:tabular-nums}

.showcard{border:3px solid var(--ink);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.showcard .lead{font:800 22px/1.25 var(--display)}
.phone{font:800 26px var(--display);font-variant-numeric:tabular-nums;user-select:all;overflow-wrap:anywhere}
.pic{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.pic svg,.pic img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}
.pic img{max-height:340px;object-fit:cover}
.pic figcaption{font-size:15px;color:var(--muted)}
.scene text{font-family:var(--display)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
label.btn{position:relative}
label.btn:focus-within{outline:3px solid var(--here);outline-offset:2px}
.slot{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:520px;margin-inline:auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{background:transparent;border:0;min-height:68px;font:800 19px var(--display);cursor:pointer;border-top:6px solid transparent}
.tabs button[aria-pressed="true"]{border-top-color:var(--here);background:var(--tint)}
.tabs .help{color:var(--stop)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:700;font-size:16px}
.field input,.field select{min-height:52px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);width:100%;min-width:0}
.hint{font-size:15px;color:var(--muted)}
.err{color:var(--stop);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.fam-pl{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.fam-pl input[type=checkbox]{width:24px;height:24px;margin-top:2px;accent-color:var(--go)}
.fam-pl .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.fam-pl select{min-height:44px;border-radius:8px;border:2px solid var(--line);background:var(--card);padding:4px 8px;max-width:100%}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--stop);color:var(--stop-ink);font:800 14px var(--display)}
.done-pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--go);color:var(--go-ink);font:800 14px var(--display)}
@media (prefers-reduced-motion:no-preference){.banner.warn,.banner.go,.banner.bad{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.97)}to{transform:none}}}

html{-webkit-text-size-adjust:100%}
.setup-btn{background:transparent;color:var(--sign-ink);border:2px solid var(--sign-ink);border-radius:8px;padding:8px 14px;font:600 16px var(--display);min-height:44px;cursor:pointer}
.checks{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
</style>
</head>

  <main id="view"></main>
</div>

const GEO={fix:null,state:'off',watch:null,lastDraw:0};

    p=>{const first=GEO.state!=='on';GEO.state='on';GEO.fix={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()};onFix(first)},
    e=>{if(e.code===1){GEO.state='denied';navigator.geolocation.clearWatch(GEO.watch);GEO.watch=null;if(S.mode==='guide'&&S.tab==='nearby')render()}},

    leg.stops.forEach((x,i)=>{const p=LL[x.id];if(!p)return;const d=dist(f.lat,f.lng,p[0],p[1]);if(d<bd){bd=d;best=i}});
    if(best>r.idx){r.idx=best;r.boarded=true;changed=true}

/* ---------- Routing over the two lines ---------- */
function lineStops(line,weekend){return (line==='E'?E_LINE:F_LINE).filter(s=>weekend||!s.wk)}
const onE=id=>E_LINE.some(s=>s.id===id), onF=id=>F_LINE.some(s=>s.id===id);
function seg(line,a,b,weekend){
  const all=lineStops(line,weekend),i=all.findIndex(s=>s.id===a),j=all.findIndex(s=>s.id===b);
  const stops=i<j?all.slice(i,j+1):all.slice(j,i+1).reverse(), dir=i<j?'Q':'M';
  const leg={line,dir,stops,towards:TOWARDS[line+dir],sims:[]};
  const prev=all[i+(dir==='Q'?-1:1)];
  if(line==='E'&&dir==='Q'&&MANH_TRUNK.includes(a)&&stops.some(s=>s.id==='7av'))
    leg.sims.push({label:'Took the C train by mistake',station:'59 St–Columbus Circle',ll:[40.768296,-73.981736],why:'This is not an E train stop. You are on an A or C train.',fix:'Get off here. Go to the Downtown platform. Take any A or C train back to 42 St–Port Authority. There, follow the signs for the E train to Queens.'});
  if(prev) leg.sims.push({label:'Went the wrong direction',station:prev.n,ll:LL[prev.id],why:'This station is the opposite way from your route.',
    fix:prev.id==='23'?'Stay on for one more stop, to 14 St. Get off there. Follow the signs for Uptown and Queens, and take the E train.':`Get off here. Follow the signs to the other platform, the side for ${TOWARDS[line+dir]}. Take the ${line} train again.`});
  const past=all[j+(dir==='Q'?1:-1)];
  if(past)leg.sims.push({label:'We passed our stop',station:past.n,ll:LL[past.id],why:`This is one stop after ${stops.at(-1).n}.`,fix:`Get off here. Follow the signs to the other platform, for trains going the opposite way. Ride back one stop to ${stops.at(-1).n}.`});
  return leg;
}
function plan(from,to,weekend){
  if(from===to)return[];
  if(onE(from)&&onE(to))return[seg('E',from,to,weekend)];
  if(onF(from)&&onF(to))return[seg('F',from,to,weekend)];
  return onF(from)?[seg('F',from,'kew',weekend),seg('E','kew',to,weekend)]:[seg('E',from,'kew',weekend),seg('F','kew',to,weekend)];
}
function signFor(leg){
  const a=leg.stops[0].id;
  if(leg.line==='E'&&leg.dir==='Q'&&MANH_TRUNK.includes(a))return{top:'Uptown & Queens',bullets:['C','E'],sub:'Take the E only. Not the A. Not the C.'};
  if(leg.line==='E'&&leg.dir==='Q')return{top:'Queens',bullets:['E'],sub:'Jamaica Center'};
  if(leg.line==='E'&&MANH_TRUNK.includes(a))return{top:'Downtown',bullets:['E'],sub:'World Trade Center'};
  if(leg.line==='E')return{top:'Manhattan',bullets:['E'],sub:'World Trade Center'};
  return leg.dir==='Q'?{top:'Jamaica',bullets:['F'],sub:'Jamaica–179 St'}:{top:'Manhattan',bullets:['F'],sub:'Trains to Manhattan'};
}

  return{title:o.title,steps:st,legs,to:o.to,from:o.from};
}

function areaOf(stop){
  if(['penn','23','14','w4'].includes(stop))return'penn';
  if(['pabt','50','7av'].includes(stop))return'times';
  if(['5av','lex'].includes(stop))return'rock';
  if(['wtc','canal','spring'].includes(stop))return'wtc';
  if(['179','169','parF','sutF','jc','sutA','vw','bri','briF','kew'].includes(stop))return'jam';
  return'penn';
}
function nearbyView(){
  const f=S.area?null:freshFix(180),M=60,GRID=1.3;let key=S.area||areaOf(S.at||dayStart(dayObj()));
  if(f){key=Object.keys(AREAS).sort((a,b)=>dist(f.lat,f.lng,AREAS[a].lat,AREAS[a].lng)-dist(f.lat,f.lng,AREAS[b].lat,AREAS[b].lng))[0];GEO.lastDraw=Date.now()}
  const A=f?{n:'Where you are now',lat:f.lat,lng:f.lng}:AREAS[key];
  const items=S.places.filter(p=>p.on&&(S.filter==='all'||p.type===S.filter)).map(p=>{
    if(p.lat==null)return p.area===key?{...p,min:null}:null;
    const dx=(p.lng-A.lng)*Math.cos(A.lat*Math.PI/180)*111320,dy=(p.lat-A.lat)*110540,min=Math.max(1,Math.round(Math.hypot(dx,dy)*GRID/M));
    return min<=20?{...p,dx,dy,min}:null}).filter(Boolean).sort((a,b)=>(a.min??99)-(b.min??99));
  items.forEach((p,i)=>p.n=i+1);
  const k=140/(20*M/GRID),pts=items.filter(p=>p.min!=null).map(p=>({n:p.n,type:p.type,x:p.dx*k,y:-p.dy*k}));
  for(let it=0;it<40;it++)for(let i=0;i<pts.length;i++){
    const a=pts[i],c=Math.hypot(a.x,a.y);if(c<26){const an=c?Math.atan2(a.y,a.x):i;a.x=Math.cos(an)*26;a.y=Math.sin(an)*26}
    for(let q=0;q<i;q++){const b=pts[q],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);if(d<28){const an=d?Math.atan2(dy,dx):i*2.4,m=(28-d)/2;a.x+=Math.cos(an)*m;a.y+=Math.sin(an)*m;b.x-=Math.cos(an)*m;b.y-=Math.sin(an)*m}}}
  const svg=`<svg class="radar" viewBox="-172 -172 344 344" role="img" aria-label="Map of saved places around ${esc(A.n)}. North is up.">
    ${[5,10,15,20].map(m=>`<circle class="ring" cx="0" cy="0" r="${m*7}"/><text class="rl" x="4" y="${-m*7+13}">${m} min</text>`).join('')}
    <text class="rl" x="0" y="-158" text-anchor="middle">NORTH</text>
    ${pts.map(p=>`<g class="pin t-${p.type}"><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="13"/><text x="${p.x.toFixed(1)}" y="${(p.y+4.5).toFixed(1)}" text-anchor="middle">${p.n}</text></g>`).join('')}
    <circle class="you" cx="0" cy="0" r="9"/><text class="youl" x="0" y="26" text-anchor="middle">YOU</text></svg>`;
  const list=items.length?`<ol class="places">${items.map(p=>`<li class="t-${p.type}"><span class="num">${p.n}</span><div class="pl-main">
      <span class="pl-type">${TYPE[p.type]}</span><span class="pl-name">${esc(p.name)}</span>
      <span class="muted">${esc(p.addr)}</span>${p.note?`<span>${esc(p.note)}</span>`:''}
      <div class="pl-row"><span class="walk">${p.min==null?'Added by family':`About ${p.min} min walk`}</span>
      <a class="btn small" href="${maps(p.name+', '+p.addr)}" target="_blank" rel="noopener">Walking map</a></div></div></li>`).join('')}</ol>`
    :`<p class="lead">No saved places within a 20 minute walk of here. Family can add more in Setup.</p>`;
  const F=[['all','All'],['food','Halal food'],['mosque','Mosque'],['wc','Restroom'],['sight','Places to visit']];
  return`<section class="card"><span class="eyebrow">Near you</span><h2>${esc(A.n)}</h2>
    <p class="muted">${f?'Using the location of this phone.':GEO.state==='denied'?'Location is turned off for this app. Choose an area.':'This phone has not found its location yet. Choose an area, or wait a moment.'}</p>
    <div class="chips" role="group" aria-label="Area"><button type="button" data-act="area" data-v="" aria-pressed="${!!f}">My location</button>${Object.entries(AREAS).map(([id,a])=>`<button type="button" data-act="area" data-v="${id}" aria-pressed="${!f&&id===key}">${esc(a.n)}</button>`).join('')}</div>
    <div class="chips" role="group" aria-label="Kind of place">${F.map(([id,l])=>`<button type="button" data-act="filter" data-v="${id}" aria-pressed="${id===S.filter}">${l}</button>`).join('')}</div>
    ${svg}<p class="muted">Each ring is 5 more minutes of slow walking. The map is drawn from saved places, so it does not need internet.</p>
    ${list}
    ${S.filter==='all'||S.filter==='food'?'<div class="tip">Look for the halal sign or certificate at the door before you order.</div>':''}</section>`;
}

  fr.readAsDataURL(t.files[0])});
load();loadPhotos();importSetup();
(function pickDay(){const now=new Date(),iso=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const d=DAYS.find(x=>x.date===iso);if(d)S.day=d.id;else if(iso>'2026-10-13'&&iso<'2026-10-20')S.day='away'})();
function saveNav(){try{const j=S.journey;localStorage.setItem(STORE+'-nav',JSON.stringify({t:Date.now(),day:S.day,at:S.at,done:S.done,j:j?{kind:j.kind,pid:j.pid,i:j.i,ride:j.ride,pos:j.pos||''}:null}))}catch(e){}}
function loadNav(){
  try{const n=JSON.parse(localStorage.getItem(STORE+'-nav')||'null');if(!n||Date.now()-n.t>12*3600e3)return;
    if(n.done&&typeof n.done==='object')S.done=n.done;if(n.day!==S.day)return;S.at=STOP[n.at]?n.at:null;
    if(n.j){ACT.start({kind:n.j.kind,id:n.j.pid},true);const j=S.journey;
      if(j&&n.j.i<j.steps.length){j.i=n.j.i;const st=j.steps[j.i];j.pos=n.j.pos||'';
        j.ride=st.type==='ride'?{idx:Math.min(Math.max(0,(n.j.ride&&n.j.ride.idx)|0),st.leg.stops.length-1),boarded:!!(n.j.ride&&n.j.ride.boarded),off:null}:null}}
  }catch(e){S.journey=null}
}
let WL=null,deferredInstall=null;
async function keepAwake(){try{if('wakeLock' in navigator&&S.journey&&document.visibilityState==='visible')WL=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake()});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(S.mode==='family')render()});
loadNav();render();
if(S.journey)keepAwake();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});navigator.serviceWorker.ready.then(()=>{S.offline=true;if(S.mode==='family'&&!document.activeElement.matches('input,select'))render()})}
try{navigator.permissions&&navigator.permissions.query({name:'geolocation'}).then(p=>{if(p.state==='granted')startGeo()})}catch(e){}
</script>
